<title>P3 Saksgangen fram til vedtak</title><desc>BPMN-diagram. Basseng: Sirevåg kommune. Baner: Saksbehandler, Leder. Eksterne deltakere: Parten. Elementer i rekkefølge: Saksbehandler: Journalpost fordelt. Saksbehandler: Lese saken. Vurdere habilitet og tidsbruk. Saksbehandler: Kan saken avgjøres innen en måned?. Saksbehandler: Sende foreløpig svar. Saksbehandler: Opplyse saken: innhente uttalelser, skrive notater. Saksbehandler: Har parten fått uttale seg?. Saksbehandler: Sende forhåndsvarsel med frist. Saksbehandler: Skrive vedtak med begrunnelse. Leder: Vurdere vedtaket. Leder: Godkjent?. Saksbehandler: Sende vedtaket med opplysning om klagerett. Saksbehandler: Klagefristen løper.</desc>
