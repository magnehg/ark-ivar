<polygon class="bp-valg" points="696,312 720,336 696,360 672,336"/><path class="bp-kryss" d="M689,329 L703,343 M703,329 L689,343"/><text class="bp-etikett" text-anchor="middle"><tspan x="696" y="288">Er dokumentet i</tspan><tspan x="696" y="303">virkeligheten besvart?</tspan></text>
<rect class="bp-oppgave" x="808" y="424" width="128" height="80" rx="10"/><text class="bp-tekst" text-anchor="middle"><tspan x="872" y="453">Registrere svaret</tspan><tspan x="872" y="468">i saken og</tspan><tspan x="872" y="483">avskrive</tspan></text>
<polygon class="bp-valg" points="872,312 896,336 872,360 848,336"/><path class="bp-kryss" d="M865,329 L879,343 M879,329 L865,343"/><text class="bp-etikett" text-anchor="middle"><tspan x="872" y="377">Over en måned uten</tspan><tspan x="872" y="392">foreløpig svar?</tspan></text>
<rect class="bp-oppgave" x="984" y="296" width="128" height="80" rx="10"/><text class="bp-tekst" text-anchor="middle"><tspan x="1048" y="332.5">Sende foreløpig</tspan><tspan x="1048" y="347.5">svar i dag</tspan></text>
<rect class="bp-oppgave" x="1160" y="168" width="128" height="80" rx="10"/><text class="bp-tekst" text-anchor="middle"><tspan x="1224" y="197">Melde tilbake til</tspan><tspan x="1224" y="212">Dokumentsenteret</tspan><tspan x="1224" y="227">innen to uker</tspan></text>
