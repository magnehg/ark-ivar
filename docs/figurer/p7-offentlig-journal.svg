<title>P7 Offentlig journal</title><desc>BPMN-diagram. Basseng: Sirevåg kommune. Baner: Ark-Ivar, Dokumentsenteret. Eksterne deltakere: Allmennheten. Elementer i rekkefølge: Ark-Ivar: Tre arbeidsdager etter journaldatoen. Ark-Ivar: Lage utkast: skjermede felt blir stjerner og hjemmel. Dokumentsenteret: Lese gjennom hele utkastet. Dokumentsenteret: Er skjermingen feil?. Dokumentsenteret: Rette skjermingen i journalposten. Dokumentsenteret: Publisere journalen på nettsiden. Dokumentsenteret: Journalen er offentlig.</desc>
