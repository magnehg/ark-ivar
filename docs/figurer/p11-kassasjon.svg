<title>P11 Årlig kassasjon</title><desc>BPMN-diagram. Basseng: Sirevåg kommune. Baner: Dokumentsenteret, Arkivleder, Enhetene, Kommunedirektør. Elementer i rekkefølge: Dokumentsenteret: Hvert år i januar. Dokumentsenteret: Ta ut saker der oppbevaringstiden er ute. Arkivleder: Kontrollere listen mot bevaringsplanen og sakenes innhold. Enhetene: Melde fra om dokumentasjon som fortsatt trengs. Arkivleder: Ta ut det som skal bevares eller fortsatt trengs. Kommunedirektør: Vurdere kassasjonslisten. Kommunedirektør: Godkjent?. Dokumentsenteret: Kassere dokumentene. Journalen beholdes. Dokumentsenteret: Føre kassasjonsprotokoll. Dokumentsenteret: Kassasjonen er dokumentert.</desc>
