<title>P6 Den daglige kontrollen</title><desc>BPMN-diagram. Basseng: Sirevåg kommune. Baner: Dokumentsenteret, Saksbehandler. Elementer i rekkefølge: Dokumentsenteret: Hver morgen. Dokumentsenteret: Åpne en journalpost som venter på kontroll. Dokumentsenteret: Riktig sak og klasse?. Dokumentsenteret: Flytte journalposten eller rette klassen. Dokumentsenteret: Tittel, parter og datoer riktige?. Dokumentsenteret: Rette opplysningene. Dokumentsenteret: Riktig skjerming med hjemmel?. Dokumentsenteret: Rette skjermingen. Spørre ved tvil. Dokumentsenteret: Ferdigstilt, lesbart og faktisk sendt?. Dokumentsenteret: Sette status Journalført. Saksbehandler: Rette og ferdigstille dokumentet. Dokumentsenteret: Klar for offentlig journal. Saksbehandler: Til ny kontroll.</desc>
