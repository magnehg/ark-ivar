<title>P3 Klage på vedtak</title><desc>BPMN-diagram. Basseng: Sirevåg kommune. Baner: Dokumentsenteret, Saksbehandler. Eksterne deltakere: Klageren, Klageinstansen. Elementer i rekkefølge: Dokumentsenteret: Klage mottatt. Dokumentsenteret: Journalføre klagen i saken vedtaket ligger i. Saksbehandler: Kan klagen behandles?. Saksbehandler: Avvise klagen. Avvisningen kan påklages. Saksbehandler: Undersøke det klagen gir grunn til. Saksbehandler: Klagen er avvist. Saksbehandler: Er klagen begrunnet?. Saksbehandler: Oppheve eller endre vedtaket. Saksbehandler: Sende saken til klageinstansen med uttalelse. Saksbehandler: Nytt vedtak er sendt. Saksbehandler: Journalføre og følge opp klageinstansens vedtak. Saksbehandler: Klagesaken er avgjort.</desc>
